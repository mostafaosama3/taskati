name: taskati2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4  
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  image_picker: ^1.2.3
  lottie: ^3.3.3
  percent_indicator: ^4.2.5
  intl: ^0.20.3
  date_picker_timeline: ^1.4.0
  flutter_slidable: ^4.0.3
dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.11.3
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: LexendDeca
      fonts:
        - asset: assets/fonts/LexendDeca-Regular.ttf
        - asset: assets/fonts/LexendDeca-Bold.ttf
          weight: 700
        - asset: assets/fonts/LexendDeca-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LexendDeca-Medium.ttf
          weight: 500
